project:
  type: website
  output-dir: ../_site/energybalance-slides

website:
  title: "Energy Balances — Slides"
  navbar:
    left:
      - text: "Energy Balances Slides"
        href: index.qmd
      - text: "Summary: Storing and Transferring Energy"
        href: 01-storing-energy.qmd
      - text: "Summary 2: Transferring Energy, Heat and Work"
        href: 02-transferring-energy.qmd

format:
  revealjs:
    theme: [default, adaptive.scss]
    slide-number: true
    toc: false
    auto-stretch: false
    css: slide_styles.css
    html-math-method: mathjax
    include-after-body:
      text: |
        <!-- MathJax retypeset (mobile render fix) -->
        <script>
          function retypeset() {
            if (window.MathJax && MathJax.typesetPromise) {
              MathJax.typesetPromise();
            }
          }
          window.addEventListener('load', function () {
            if (typeof Reveal !== 'undefined') {
              Reveal.on('ready', retypeset);
              Reveal.on('slidechanged', retypeset);
              Reveal.on('resize', retypeset);
            }
            window.addEventListener('orientationchange', retypeset);
            window.addEventListener('pageshow', function (event) {
              if (event.persisted) retypeset();
            });
          });
        </script>

        <!-- Force adaptive SVG figures to re-decode against the current OS
             colour scheme, so they flip live rather than only after a manual
             reload (embedded <img> SVGs keep a lazy buffer on iOS). -->
        <script>
          (function () {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            function refreshFigures() {
              document.querySelectorAll('.reveal img[src*=".svg"]').forEach(function (img) {
                var base = img.getAttribute('data-cs-base') || img.src.split('#')[0].split('?')[0];
                img.setAttribute('data-cs-base', base);
                var next = base + '?cs=' + (mq.matches ? 'dark' : 'light');
                if (img.src !== next) img.src = next;
              });
            }
            window.addEventListener('load', function () {
              refreshFigures();
              if (typeof Reveal !== 'undefined') Reveal.on('ready', refreshFigures);
              window.addEventListener('pageshow', function (event) {
                if (event.persisted) refreshFigures();
              });
              mq.addEventListener('change', refreshFigures);
            });
          })();
        </script>