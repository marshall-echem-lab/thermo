name: Deploy Thermo Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python3 -m pip install -r py_requirements.txt

      - name: Stage shared assets into each sub-project
        env:
          COURSE: energybalance
        run: |
          for proj in "$COURSE"-book "$COURSE"-slides; do
            for asset in figures examples problems; do
              rm -rf "$proj/$asset"
              cp -r  "$asset" "$proj/$asset"
            done
          done

      - name: Generate auto chapters (book only)
        run: |
          cd energybalance-book
          python3 ../scripts/generate-key-terms.py energybalance-book
          python3 ../scripts/generate-problems-solutions.py

      - name: Render energybalance-book
        run: quarto render energybalance-book

      - name: Render energybalance-slides
        run: quarto render energybalance-slides

      # - name: Render thermodynamics-book
      #   run: quarto render thermodynamics-book
      # - name: Render thermodynamics-slides
      #   run: quarto render thermodynamics-slides

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4